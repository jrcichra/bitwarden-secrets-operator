apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bitwardensecrets.jrcichra.dev
spec:
  group: jrcichra.dev
  names:
    categories: []
    kind: BitwardenSecret
    plural: bitwardensecrets
    shortNames:
    - bws
    singular: bitwardensecret
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.name
      name: Secret
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for BitwardenSecretSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Materializes the Secrets Manager secret `spec.name` as a `Secret` with the
              same name and namespace as this object.
            properties:
              key:
                description: '`Secret` data key for a non-login value. Defaults to `notes`.'
                nullable: true
                type: string
              name:
                description: Secrets Manager secret name.
                type: string
              type:
                description: '`Secret` type, e.g. `kubernetes.io/dockerconfigjson`.'
                nullable: true
                type: string
            required:
            - name
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                description: Standard conditions; `Ready` says whether the `Secret` is in sync.
                items:
                  description: |-
                    Same shape as `metav1.Condition`, so `kubectl wait --for=condition=Ready`
                    works.
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      type: string
                    status:
                      description: '`True` or `False`.'
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        required:
        - spec
        title: BitwardenSecret
        type: object
    served: true
    storage: true
    subresources:
      status: {}
