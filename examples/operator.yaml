apiVersion: v1
kind: Namespace
metadata:
  name: bitwarden-secrets-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bitwarden-secrets-operator
  namespace: bitwarden-secrets-operator
---
# leader election
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bitwarden-secrets-operator
  namespace: bitwarden-secrets-operator
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bitwarden-secrets-operator
  namespace: bitwarden-secrets-operator
subjects:
  - kind: ServiceAccount
    name: bitwarden-secrets-operator
    namespace: bitwarden-secrets-operator
roleRef:
  kind: Role
  name: bitwarden-secrets-operator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bitwarden-secrets-operator
rules:
  # list/watch is limited in practice to the operator's own Secrets by a
  # label selector, but RBAC can't express that: treat this as cluster-wide
  # Secret read (patch alone already returns a Secret's contents)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch", "list", "watch"]
  - apiGroups: ["jrcichra.dev"]
    resources: ["bitwardensecrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["jrcichra.dev"]
    resources: ["bitwardensecrets/status"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bitwarden-secrets-operator
subjects:
  - kind: ServiceAccount
    name: bitwarden-secrets-operator
    namespace: bitwarden-secrets-operator
roleRef:
  kind: ClusterRole
  name: bitwarden-secrets-operator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitwarden-secrets-operator
  namespace: bitwarden-secrets-operator
spec:
  replicas: 2 # leader-elected; the standby takes over in ~15s
  selector:
    matchLabels:
      app: bitwarden-secrets-operator
  template:
    metadata:
      labels:
        app: bitwarden-secrets-operator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: bitwarden-secrets-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # distroless `nonroot`
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bitwarden-secrets-operator
          image: ghcr.io/jrcichra/bitwarden-secrets-operator:latest # pin a sha-<commit> tag
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: BWS_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bitwarden-credentials
                  key: BWS_ACCESS_TOKEN
