apiVersion: v1
kind: Namespace
metadata:
  name: bitwarden-secrets-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bitwarden-secrets-operator
  namespace: bitwarden-secrets-operator
---
# leader election
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bitwarden-secrets-operator
  namespace: bitwarden-secrets-operator
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bitwarden-secrets-operator
  namespace: bitwarden-secrets-operator
subjects:
  - kind: ServiceAccount
    name: bitwarden-secrets-operator
    namespace: bitwarden-secrets-operator
roleRef:
  kind: Role
  name: bitwarden-secrets-operator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bitwarden-secrets-operator
rules:
  # write-only: the operator server-side-applies Secrets and never reads them
  # back. Deletes happen via ownerReferences garbage collection.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["patch", "create"]
  - apiGroups: ["jrcichra.dev"]
    resources: ["bitwardensecrets"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bitwarden-secrets-operator
subjects:
  - kind: ServiceAccount
    name: bitwarden-secrets-operator
    namespace: bitwarden-secrets-operator
roleRef:
  kind: ClusterRole
  name: bitwarden-secrets-operator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitwarden-secrets-operator
  namespace: bitwarden-secrets-operator
spec:
  replicas: 2 # leader-elected; the standby takes over in ~15s
  selector:
    matchLabels:
      app: bitwarden-secrets-operator
  template:
    metadata:
      labels:
        app: bitwarden-secrets-operator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: bitwarden-secrets-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's `node` user
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # bw's data.json (encrypted vault cache). RAM-backed so it never
        # lands on node disk.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      containers:
        - name: bitwarden-secrets-operator
          image: ghcr.io/jrcichra/bitwarden-secrets-operator:latest # pin a sha-<commit> tag
          # Seed a fixed device ID before the first login, so pod restarts
          # don't show up as "new device" logins (see README).
          command:
            - sh
            - -c
            - >-
              mkdir -p "$BITWARDENCLI_APPDATA_DIR" &&
              f="$BITWARDENCLI_APPDATA_DIR/data.json" && [ -s "$f" ] ||
              printf '{"global_applicationId_appId":"%s"}' "$BW_DEVICE_ID" > "$f";
              exec /app/bitwarden-secrets-operator
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: HOME
              value: /tmp
            - name: BITWARDENCLI_APPDATA_DIR
              value: /tmp/bw
            - name: BW_DEVICE_ID
              value: 00000000-0000-4000-8000-000000000000 # replace with `uuidgen` output
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: BW_CLIENTID
              valueFrom:
                secretKeyRef:
                  name: bitwarden-credentials
                  key: BW_CLIENTID
            - name: BW_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: bitwarden-credentials
                  key: BW_CLIENTSECRET
            - name: BW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bitwarden-credentials
                  key: BW_PASSWORD
