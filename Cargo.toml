[package]
name = "bitwarden-secrets-operator"
version = "2.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.98"
axum = "0.8.4"
bitwarden = { version = "2.1.0", features = ["secrets"] }
clap = { version = "4.5.42", features = ["derive", "env"] }
futures = "0.3.31"
k8s-openapi = { version = "0.27.0", features = ["latest", "schemars"] }
kube = { version = "3.0.1", features = ["runtime", "derive"] }
kube-leader-election = "0.43.0"
prometheus = "0.14.0"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
schemars = "1.1.0"
serde = "1.0.219"
serde_json = "1.0.142"
thiserror = "2.0.12"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

[profile.release]
strip = true
