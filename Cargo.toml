[package]
name = "bitwarden-secrets-operator"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.98"
axum = "0.8.4"
bitwarden = { version = "2.1.0", features = ["secrets"] }
chrono = "0.4.41"
clap = { version = "4.5.42", features = ["derive", "env"] }
futures = "0.3.31"
gethostname = "1.0.2"
k8s-openapi = { version = "0.27.0", features = ["latest"] }
kube = { version = "3.0.1", features = ["runtime", "derive"] }
kube-leader-election = "0.43.0"
prometheus = { version = "0.14.0" , features = ["process"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
schemars = "1.1.0"
serde = "1.0.219"
serde_json = "1.0.142"
serde_yaml = "0.9.33"
thiserror = "2.0.12"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
uuid = "1"

[profile.release]
strip = true
